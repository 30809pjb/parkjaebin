<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EE-Exam Proctor: AI 전공 구두시험 채점기</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      font-family: 'Segoe UI', system-ui, sans-serif; color: #f1f5f9;
    }
    .container {
      width: min(750px, 92%); margin: 40px auto;
      background: #1e293b; border-radius: 12px; padding: 30px;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3); border: 1px solid #334155;
    }
    h1 { text-align: center; font-size: 26px; color: #38bdf8; margin: 0 0 5px; letter-spacing: -0.5px; }
    .subtitle { text-align: center; color: #64748b; margin-bottom: 25px; font-size: 13px; text-transform: uppercase; }
    
    .auth-box {
      background: #0f172a; padding: 15px; border-radius: 8px; margin-bottom: 25px;
      display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap;
      border: 1px solid #334155;
    }
    .auth-inputs input {
      height: 36px; padding: 0 10px; background: #1e293b; border: 1px solid #475569;
      color: #fff; border-radius: 4px; outline: none; font-size: 13px;
    }
    .auth-inputs input:focus { border-color: #38bdf8; }
    .main-content { display: none; }
    .main-content.active { display: block; }

    .exam-card {
      background: #0f172a; padding: 20px; border-radius: 10px; border: 1px solid #334155; margin-bottom: 20px;
    }
    .circuit-tag {
      display: inline-block; background: #38bdf8; color: #0f172a; 
      padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; margin-bottom: 10px;
    }
    .quiz-question { font-size: 16px; font-weight: 500; line-height: 1.6; color: #f8fafc; margin-bottom: 15px; }

    .label { font-weight: bold; margin: 15px 0 6px; color: #94a3b8; font-size: 14px; }
    input[type="text"] {
      width: 100%; height: 46px; padding: 0 15px; background: #0f172a;
      border: 1px solid #475569; color: #38bdf8; border-radius: 6px;
      font-size: 15px; outline: none; transition: 0.15s;
    }
    input[type="text"]:focus { border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15); }

    .btn {
      padding: 12px 24px; border: none; border-radius: 6px; font-weight: bold;
      cursor: pointer; font-family: inherit; transition: 0.15s;
    }
    .btn-rand { background: #6366f1; color: #fff; width: 100%; margin-bottom: 20px; font-size: 15px; }
    .btn-ai { background: #38bdf8; color: #0f172a; }
    .btn-tts { background: #10b981; color: #fff; }
    .btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .result-box { margin-top: 25px; padding: 20px; background: #0f172a; border-radius: 10px; border: 1px solid #334155; }
    .proctor-comment { background: #1e293b; padding: 15px; border-radius: 6px; font-size: 14px; line-height: 1.6; color: #cbd5e1; white-space: pre-wrap; }
    
    .control-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
    select {
      height: 42px; padding: 0 10px; background: #1e293b; border: 1px solid #475569;
      color: #fff; border-radius: 6px; outline: none;
    }
    audio { width: 100%; margin-top: 15px; }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDpxWyk5OZcjZ7JqHli-lO09HWf7H9w8gA",
      authDomain: "ppjb-8bd54.firebaseapp.com",
      projectId: "ppjb-8bd54",
      storageBucket: "ppjb-8bd54.firebasestorage.app",
      messagingSenderId: "20897717683",
      appId: "1:20897717683:web:76d67f991b94e0e5517fc6",
      databaseURL: "https://ppjb-8bd54-default-rtdb.firebaseio.com" // 데이터베이스 경로 연동 완료
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app); // 👈 데이터베이스 연결 객체 활성화
    
    // 🚨 [필수 확인] 네 최신 구글 웹앱 URL 주소인지 확인해줘!
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzhdvtlWniuPokcW0Dd88-rGQHW0KXmpY8ZSXTyzID_lz1PWlJsoIrxxB5ir9OdYnfQ/exec';

    window.fbAuth = { auth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut };
    window.fbDB = { database, ref, push }; // 자바스크립트에서 쓸 수 있게 전역에 등록
    window.APPS_SCRIPT_URL = APPS_SCRIPT_URL;
  </script>
</head>
<body>
  <div class="container">
    <h1>🔌 EE-Exam Proctor</h1>
    <div class="subtitle">전기전자 전공구두시험 AI 출제 및 실시간 채점 시스템</div>

    <div class="auth-box">
      <div id="authStatusText" style="color: #94a3b8; font-size:14px;">실험실 입장을 위해 학생 인증(로그인)이 필요합니다.</div>
      <div class="auth-inputs" id="authInputs">
        <input type="email" id="emailInput" placeholder="이메일 주소"/>
        <input type="password" id="passInput" placeholder="비밀번호"/>
        <button class="btn" style="background:#334155; color:#fff; padding:6px 12px; font-size:13px;" onclick="handleSignUp()">학생등록</button>
        <button class="btn" style="background:#38bdf8; color:#0f172a; padding:6px 12px; font-size:13px;" onclick="handleSignIn()">인증 로그인</button>
      </div>
      <button id="logoutBtn" class="btn" style="background:#ef4444; color:#fff; display:none; padding:6px 12px; font-size:13px;" onclick="handleSignOut()">로그아웃</button>
    </div>

    <div id="mainService" class="main-content">
      <button class="btn btn-rand" onclick="loadRandomQuestion()">🎲 무작위 전공 구두시험 문항 출제</button>

      <div class="exam-card" id="examCard" style="display: none;">
        <div class="circuit-tag" id="questionTag">CODE_READY</div>
        <div class="quiz-question" id="questionText">질문을 불러오는 중입니다...</div>
        
        <label class="label">✍️ 수험자 답안 작성</label>
        <input type="text" id="userInput" placeholder="답변을 입력하세요." />
        
        <div style="text-align: right; margin-top: 15px;">
          <button class="btn btn-ai" id="aiBtn" onclick="submitExamAnswer()">시험 채점 및 피드백 요청</button>
        </div>
      </div>

      <div id="resultSection" class="result-box" style="display: none;">
        <label class="label" style="color:#38bdf8;">👨‍🏫 AI 출제위원 채점 의견서</label>
        <div class="proctor-comment" id="proctorComment">AI가 수험자의 답안을 분석하고 있습니다...</div>

        <div class="control-grid">
          <select id="voiceSelect">
            <option value="onyx">onyx (근엄한 중년 교수님)</option>
            <option value="nova">nova (깐깐한 젊은 박사님)</option>
            <option value="alloy">alloy (표준 연구원 보이스)</option>
          </select>
          <button class="btn btn-tts" id="makeBtn" onclick="playProctorVoice()">🔊 교수님 구두 총평 듣기</button>
        </div>
        <audio id="audioPlayer" controls style="display:none;"></audio>
      </div>
    </div>
  </div>

  <script>
    let currentUser = null;
    let currentQuiz = null;

    const textQuestionPool = [
      { tag: "회로이론-기초", desc: "옴의 법칙(Ohm's Law)에서 전압(V), 전류(I), 저항(R) 삼각 관계의 정의를 간단하게 설명하고, 저항이 일정할 때 전압이 변하면 전류는 어떻게 변하는지 서술하시오." },
      { tag: "전자회로-소자", desc: "다이오드(Diode)의 가장 대표적인 전기적 특성(기능) 한 가지를 설명하고, 순방향 바이어스와 역방향 바이어스일 때 전류의 흐름이 각각 어떻게 되는지 설명하시오." },
      { tag: "회로이론-법칙", desc: "키르히호프의 전류 법칙(KCL)과 전압 법칙(KVL) 중 하나를 선택하여 그 핵심 개념이 무엇을 의미하는지 간단히 설명하시오." },
      { tag: "디지털공학", desc: "디지털 논리회로에서 AND 게이트와 OR 게이트의 동작 차이점을 입력과 출력 결과의 관점에서 비교하여 서술하시오." },
      { tag: "전자회로-부품", desc: "콘덴서(커패시터)가 회로 내부에서 수행하는 주된 역할이 무엇인지 에너지를 충전하는 관점이나 신호를 필터링하는 관점을 엮어서 간단히 설명하시오." }
    ];

    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        if (!window.fbAuth) return;
        window.fbAuth.auth.onAuthStateChanged((user) => {
          if (user) {
            currentUser = user;
            document.getElementById('authStatusText').textContent = `👨‍🎓 수험자 인증 완료: ${user.email}`;
            document.getElementById('authInputs').style.display = 'none';
            document.getElementById('logoutBtn').style.display = 'block';
            document.getElementById('mainService').classList.add('active');
          } else {
            currentUser = null;
            document.getElementById('authStatusText').textContent = `실험실 입장을 위해 학생 인증(로그인)이 필요합니다.`;
            document.getElementById('authInputs').style.display = 'flex';
            document.getElementById('logoutBtn').style.display = 'none';
            document.getElementById('mainService').classList.remove('active');
          }
        });
      }, 1000);
    });

    async function handleSignUp() {
      const email = document.getElementById('emailInput').value;
      const password = document.getElementById('passInput').value;
      try { await window.fbAuth.createUserWithEmailAndPassword(window.fbAuth.auth, email, password); alert('학생 등록 완료! 로그인해 주세요.'); } catch(e) { alert(e.message); }
    }

    async function handleSignIn() {
      const email = document.getElementById('emailInput').value;
      const password = document.getElementById('passInput').value;
      try { await window.fbAuth.signInWithEmailAndPassword(window.fbAuth.auth, email, password); } catch(e) { alert(e.message); }
    }

    function handleSignOut() { window.fbAuth.signOut(window.fbAuth.auth); }

    function loadRandomQuestion() {
      document.getElementById('resultSection').style.display = 'none';
      document.getElementById('userInput').value = '';
      const randIdx = Math.floor(Math.random() * textQuestionPool.length);
      currentQuiz = textQuestionPool[randIdx];
      document.getElementById('questionTag').textContent = currentQuiz.tag;
      document.getElementById('questionText').textContent = currentQuiz.desc;
      document.getElementById('examCard').style.display = 'block';
    }

    async function submitExamAnswer() {
      const userAns = document.getElementById('userInput').value.trim();
      if(!userAns) return alert('답안을 입력하세요.');

      const aiBtn = document.getElementById('aiBtn');
      aiBtn.disabled = true; aiBtn.textContent = '⚡ 채점 중...';
      document.getElementById('resultSection').style.display = 'block';
      document.getElementById('proctorComment').textContent = '제출된 답변을 교수님 관점에서 판독하고 있습니다...';

      let promptPayload = `[출제 문제 설명]: ${currentQuiz.desc}\n[학생이 제출한 답안]: ${userAns}\n채점하여 피드백을 제공하라.`;

      try {
        const response = await fetch(window.APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({ type: 'chat', question: promptPayload })
        });
        
        const data = await response.json();
        if (data.error) throw new Error(data.error);
        
        // 1. 브라우저 화면에 AI 채점 의견서 표시
        document.getElementById('proctorComment').textContent = data.answer;

        // 🚨 [데이터베이스 저장 연동 추가]
        // 로그인 상태이고 데이터베이스 라이브러리가 준비되었다면 파이어베이스에 누적 저장 시작!
        if (currentUser && window.fbDB) {
          const now = new Date();
          const timestamp = now.getFullYear() + ". " + (now.getMonth() + 1) + ". " + now.getDate() + ". " + (now.getHours() >= 12 ? "오후 " : "오전 ") + (now.getHours() % 12 || 12) + ":" + String(now.getMinutes()).padStart(2, '0') + ":" + String(now.getSeconds()).padStart(2, '0');
          
          // 로그인한 학생 고유의users/UID/items 경로 참조 생성
          const userExamRef = window.fbDB.ref(window.fbDB.database, 'users/' + currentUser.uid + '/items');
          
          // 파이어베이스 트리에 밀어넣기
          await window.fbDB.push(userExamRef, {
            title: "박재빈_" + currentQuiz.tag, // 과목 태그 명시
            content: userAns,                  // 수험자 주관식 답안
            ai_feedback: data.answer,          // 👈 생성된 AI 해설 의견서를 같이 저장!
            createdAt: timestamp,
            updatedAt: ""
          });
          console.log("파이어베이스 실시간 데이터베이스 백업 성공!");
        }

      } catch (error) {
        console.error(error);
        document.getElementById('proctorComment').textContent = '오류 발생: ' + error.message;
      } finally {
        aiBtn.disabled = false; aiBtn.textContent = '시험 채점 및 피드백 요청';
      }
    }

    async function playProctorVoice() {
      const text = document.getElementById('proctorComment').textContent;
      const makeBtn = document.getElementById('makeBtn');
      makeBtn.disabled = true; makeBtn.textContent = '⏳ 오디오 합성 중...';

      try {
        const response = await fetch(window.APPS_SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({
            type: 'tts',
            text: text,
            model: 'tts-1',
            voice: document.getElementById('voiceSelect').value,
            speed: 1.0
          })
        });

        const data = await response.json();
        if (data.error) throw new Error(data.error);

        const byteCharacters = atob(data.audioBase64);
        const byteArrays = [];
        for (let offset = 0; offset < byteCharacters.length; offset += 512) {
          const slice = byteCharacters.slice(offset, offset + 512);
          const byteNumbers = new Array(slice.length);
          for (let i = 0; i < slice.length; i++) { byteNumbers[i] = slice.charCodeAt(i); }
          byteArrays.push(new Uint8Array(byteNumbers));
        }
        
        const player = document.getElementById('audioPlayer');
        player.src = URL.createObjectURL(new Blob(byteArrays, { type: 'audio/mpeg' }));
        player.style.display = 'block';
        player.play();
      } catch (error) {
        alert('TTS 오디오 트랙 생성 실패: ' + error.message);
      } finally {
        makeBtn.disabled = false; makeBtn.textContent = '🔊 교수님 구두 총평 듣기';
      }
    }
  </script>
</body>
</html>
